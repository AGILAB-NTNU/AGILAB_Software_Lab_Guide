site_name: AGILAB Software Lab Guide
site_description: Centralized software development and research guidelines for AGILAB.
site_url: https://agilab-ntnu.github.io/AGILAB_Software_Lab_Guide/

theme:
  name: material
  logo: assets/images/logo/AGILAB.png
  favicon: assets/images/logo/AGILAB_Logo.png
  language: zh-TW
  palette:
    # Day mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Night mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

nav:
  - 'English Manual':
    - 'Home': 'index.md'
    - 'Getting Started': 'en/contributing.md'
    - 'Reproducibility': 'en/reproducibility.md'
    - 'Environment': 'en/conda_guide.md'
    - 'Lifecycle': 'en/lifecycle.md'
    - 'Commit Convention': 'en/git_convention.md'
  - '繁體中文手冊':
    - '首頁': 'zh/index.md'
    - '環境管理': 'zh/conda_guide.md'
    - '快速啟動': 'zh/contributing.md'
    - '模板結構說明': 'zh/template_structure.md'
    - 'Commit 規範': 'zh/git_convention.md'
    - '開發指南':
      - '日常 Git 操作': 'zh/daily_git.md'
      - '撰寫與執行測試': 'zh/testing.md'
      - 'Logging 與除錯': 'zh/logging_debugging.md'
      - '實驗管理': 'zh/experiment_management.md'
    - '研究可重現性': 'zh/reproducibility.md'
    - '專案生命週期': 'zh/lifecycle.md'
    - '附錄':
      - 'Google Python Style Guide': 'zh/google_style_guide.md'
      - 'Type Hinting 入門': 'zh/type_hinting.md'
      - '開發模式安裝': 'zh/editable_install.md'
      - 'Google Style Docstrings': 'zh/docstrings.md'
      - '進階測試技巧': 'zh/testing_advanced.md'
      - '進階 Logging 與除錯': 'zh/logging_advanced.md'
      - 'tmux 無 sudo 安裝': 'zh/tmux_guide.md'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
