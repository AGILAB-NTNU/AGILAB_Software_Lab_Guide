<svg viewBox="0 0 580 460" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976D2"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="aOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E65100"/>
    </marker>
    <marker id="aRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#B71C1C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="580" height="460" rx="14" fill="#F7F8FA"/>

  <!-- Title -->
  <text x="290" y="34" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474F">Fork 工作流 ─ 三個地方、兩條連線</text>

  <!-- ── Box 1: Upstream ── -->
  <rect x="140" y="54" width="300" height="72" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="290" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">AGILAB-NTNU / project</text>
  <text x="290" y="104" text-anchor="middle" font-size="12" fill="#1565C0">upstream（實驗室 repo）</text>

  <!-- ── Box 2: Origin ── -->
  <rect x="140" y="206" width="300" height="72" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="290" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B5E20">YOUR_NAME / project</text>
  <text x="290" y="256" text-anchor="middle" font-size="12" fill="#2E7D32">origin（你的 fork）</text>

  <!-- ── Box 3: Local ── -->
  <rect x="140" y="354" width="300" height="72" rx="10" fill="#FFF8E1" stroke="#F57F17" stroke-width="2"/>
  <text x="290" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">你的電腦（本機）</text>
  <text x="290" y="404" text-anchor="middle" font-size="12" fill="#F57F17">實際寫程式的地方</text>

  <!-- ── Right: Fork ↓ ── -->
  <line x1="448" y1="126" x2="448" y2="200" stroke="#1976D2" stroke-width="1.8" marker-end="url(#aBlue)"/>
  <text x="460" y="157" font-size="12" fill="#1976D2">Fork</text>
  <text x="460" y="172" font-size="10" fill="#90A4AE">GitHub 網頁</text>

  <!-- ── Right: git clone ↓ ── -->
  <line x1="448" y1="278" x2="448" y2="348" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#aGreen)"/>
  <text x="460" y="316" font-size="12" fill="#2E7D32">git clone</text>

  <!-- ── Left: git push ↑ ── -->
  <line x1="132" y1="354" x2="132" y2="284" stroke="#E65100" stroke-width="1.8" marker-end="url(#aOrange)"/>
  <text x="6" y="321" font-size="12" fill="#E65100">git push</text>

  <!-- ── Left: Pull Request ↑ ── -->
  <line x1="132" y1="206" x2="132" y2="132" stroke="#B71C1C" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="6" y="168" font-size="12" fill="#B71C1C">Pull</text>
  <text x="6" y="183" font-size="12" fill="#B71C1C">Request</text>

  <!-- ── Footer ── -->
  <line x1="60" y1="445" x2="520" y2="445" stroke="#CFD8DC" stroke-width="1"/>
  <text x="290" y="458" text-anchor="middle" font-size="11" fill="#78909C">同步上游：git fetch upstream  →  git merge upstream/dev</text>
</svg>
